# Uptime Kuma：对网站和服务做拨测监控，掉线时经自带的通知渠道告警。
services:
  kuma:
    # 上游官方 rootless 镜像（MIT），按 amd64/arm64/arm 清单列表摘要固定。
    image: louislam/uptime-kuma:2.5.9-rootless@sha256:ea1b2ceb6ef710a3d0d994debcc8cded062e534fb901f6e895f59caad68e0a9e
    # 内嵌 MariaDB 仅接受 node/root；固定 node 的 UID/GID，由核心准备同属主的数据目录。
    user: "1000:1000"
    # 仅数据目录与临时目录可写；Chromium 的缓存和 crashpad 使用临时 HOME。
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      TZ: ${TZ}
      HOME: /tmp
      # 跳过首次打开的数据库设置页：上游 setup-database.js 见到这个变量就不再进设置流程，
      # 直接按 SQLite 写 db-config.json 并继续启动。
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      # 数据库、监控历史、状态页与截图一起持久化，卸载保留数据时不删除。
      - ${WONTON_APP_DATA}:/app/data
    healthcheck:
      # 上游 extra/healthcheck 连 5xx 也返回成功；直接检查 HTTP API 并拒绝错误状态。
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3001/api/entry-page"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

  # 一次性服务：调上游自己的事件预建主人的管理员账号并关掉应用自己的登录（disableAuth），
  # 再预置一条发进云吞私聊的邮件通知（上游 2.5.9 没有发信的环境变量，通知只能走它自己的事件存库）。
  # 装完第一次打开直接可用，不需要记应用密码。用同一个官方镜像，脚本只用镜像自带的
  # socket.io-client（生产依赖）。成功后写标记文件，升级、重建时看到标记直接退出；已有账号
  # 且密码对不上（主人接管过）也不动它的设置。kuma 没监听时靠脚本里的自动重连等待，
  # 所以 depends_on 用 started 就够。
  setup-admin:
    image: louislam/uptime-kuma:2.5.9-rootless@sha256:ea1b2ceb6ef710a3d0d994debcc8cded062e534fb901f6e895f59caad68e0a9e
    user: "1000:1000"
    entrypoint: ["node", "/app/setup-admin.mjs"]
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME:?核心没有注入用户名}
      WONTON_SECRET_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
      # 预置邮件通知用：SMTP 地址、发件人来自 notify 权限，收件人是主人的内部邮箱。
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST:?核心没有注入 SMTP 服务器}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT:?核心没有注入 SMTP 端口}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM:?核心没有注入发件地址}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?核心没有注入内部邮箱}
    volumes:
      # 标记文件写在数据目录里；kuma 也挂这里，两边属主一致（1000:1000）。
      - ${WONTON_APP_DATA}:/app/data
    configs:
      - source: setup-admin
        target: /app/setup-admin.mjs
    depends_on:
      kuma:
        condition: service_started
    restart: "no"

configs:
  setup-admin:
    file: setup-admin.mjs

x-wonton:
  spec: "0.11"
  id: fyi.kuma.uptime-kuma
  version: 0.3.0
  kind: app
  title: { zh: 掉线提醒（Uptime Kuma）, en: Downtime Alerts (Uptime Kuma) }
  description: { zh: 像给网站和服务请了个值班员：定时看看通不通，一掉线马上在云吞私聊里提醒你。, en: "A watchman for your websites and services: it checks on them regularly and messages you in Wonton the moment one goes down." }
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/monitors.png, screenshots/add-monitor.png, screenshots/monitor-detail.png, screenshots/notifications.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://uptime.kuma.pet
  license: MIT
  tags:
    zh: [监控]
    en: [Monitoring]
  about:
    zh: |
      盯着你的网站和服务，支持网址、端口、ping 和 DNS，掉线时提醒你：已预置一条邮件通知，新建的监控默认把告警发进你的云吞私聊，Telegram、Webhook 等渠道也照常可加。

      打开直接可用，不用登录应用本身：管理员账号已预建，应用自己的登录已关——网页只经云吞网关进来，网关已经认了你。邮件通知的收件人只能是家里人，改成外部邮箱会发送失败（应用报发送失败）。外部心跳推送会被拦下，状态页只给登录了云吞的你看。
    en: |
      Watch your sites and services over HTTP(s), ports, ping and DNS, and get alerted when they go down: an email notification is pre-created, so new monitors alert your Wonton chat by default; Telegram, webhook and more can be added as usual.

      Open and use it straight away — no app sign-in: an administrator account is pre-created and the app's own login is off, because the page is only reachable through the Wonton gateway, which already authenticates you. Notification recipients can only be household members — an outside address fails to send (the app reports the failure). External push heartbeats are blocked, and status pages are only visible to you through the gateway.
  release_notes:
    zh: 接上云吞的内部邮箱：装好即有一条预置的邮件通知（主机、发件人、收件人都已配好），新建监控默认把告警发进你的云吞私聊；收件人只能是家里人。
    en: Hooks up the Wonton internal mailbox — an email notification ships pre-configured (host, sender and recipient all set), so new monitors alert your Wonton chat by default; recipients can only be household members.
  webui:
    service: kuma
    port: 3001
    # Uptime Kuma 不支持 OIDC，也不认反向代理传来的用户名。setup-admin 会关掉它自己的登录（disableAuth）：
    # 打开网页只此一条路，网关先校验用户的会话才转发，所以应用可以免登。
    sso: none
  permissions:
    # 拨测要访问外网和局域网里的设备；通知渠道（Telegram、SMTP、Webhook）也得出网。
    # Checks reach the internet and LAN devices, and notification channels (Telegram, SMTP, webhook) need egress too.
    - network.egress
    # 知道用户名和内部邮箱：管理员账号按注入的用户名预建，邮件通知发给注入的内部邮箱。
    # Knows the username and internal mailbox: the admin account is pre-created from the injected
    # username, and email alerts go to the injected internal mailbox.
    - owner.identity
    # 发信：预置的邮件通知经核心的 SMTP 服务器把告警发进主人的云吞私聊。
    # Sends mail: the pre-created email notification delivers alerts to the owner's Wonton chat
    # through the core's SMTP server.
    - notify
  secrets:
    # 预建管理员的登录密码：核心生成，升级和保留数据的重装都不变。
    admin_password:
      generate: { bytes: 32 }
  # 上游没写最低内存；本机空闲实测约 92M，取 256M。镜像支持 amd64 和 arm64（docker manifest inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
