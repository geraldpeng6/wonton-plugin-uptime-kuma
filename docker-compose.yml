# Uptime Kuma：对网站和服务做拨测监控，掉线时经自带的通知渠道告警。
services:
  kuma:
    # 上游官方 rootless 镜像（MIT），按 amd64/arm64/arm 清单列表摘要固定。
    image: louislam/uptime-kuma:2.5.9-rootless@sha256:ea1b2ceb6ef710a3d0d994debcc8cded062e534fb901f6e895f59caad68e0a9e
    # 内嵌 MariaDB 仅接受 node/root；固定 node 的 UID/GID，由核心准备同属主的数据目录。
    user: "1000:1000"
    # 仅数据目录与临时目录可写；Chromium 的缓存和 crashpad 使用临时 HOME。
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      TZ: ${TZ}
      HOME: /tmp
    volumes:
      # 数据库、监控历史、状态页与截图一起持久化，卸载保留数据时不删除。
      - ${WONTON_APP_DATA}:/app/data
    healthcheck:
      # 上游 extra/healthcheck 连 5xx 也返回成功；直接检查 HTTP API 并拒绝错误状态。
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3001/api/entry-page"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

x-wonton:
  spec: "0.4"
  id: fyi.kuma.uptime-kuma
  version: 0.1.0
  kind: app
  title: { zh: 在线监控, en: Uptime Kuma }
  description: { zh: 监控网站和服务是否在线，掉线时告警, en: Watch your sites and services for downtime and alert when they go dark }
  icon: icon.png
  notices: [NOTICE]
  category: network
  screenshots: [screenshots/monitors.png, screenshots/add-monitor.png, screenshots/monitor-detail.png, screenshots/notifications.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://uptime.kuma.pet
  license: MIT
  tags: [监控, 拨测, uptime, 告警]
  about:
    zh: |
      监控公网站点和局域网设备的在线状态，支持 HTTP(s)、TCP 端口、ping 和 DNS。掉线时通过 Uptime Kuma
      自带的通知渠道告警，如邮件、Telegram、Webhook 和 Apprise。

      第一次打开时选择数据库并创建管理员账号，保留应用登录。网页还受云吞网关的主人会话保护。

      状态页和徽章仅供已登录的主人查看，不可公开分享。外部 Push 心跳会被网关拦截；其他插件的网页地址也要求
      主人会话，不能直接用它们判断插件健康。通知不接入云吞 notify。
    en: |
      Monitor public websites and LAN devices using HTTP(s), TCP ports, ping and DNS. Send downtime alerts
      through Uptime Kuma's notification channels, including email, Telegram, webhooks and Apprise.

      On first open, choose a database and create an administrator account. Keep application authentication
      enabled; the web interface is also protected by the Wonton gateway's owner session.

      Status pages and badges are visible only to the signed-in owner, not public visitors. The gateway
      blocks external Push heartbeats. Other plugins' web addresses also require an owner session and
      cannot directly indicate plugin health. Alerts do not use Wonton notify.
  release_notes:
    zh: 首个版本，使用官方 rootless 镜像，保留应用登录，支持主动监控与应用自带通知渠道。
    en: First release with the official rootless image, application authentication, active monitoring and upstream notification channels.
  webui:
    service: kuma
    port: 3001
    # Uptime Kuma 不支持 OIDC，也不认反向代理传来的用户名；sso: none 时网关仍先校验主人的会话才转发。
    sso: none
  permissions:
    # 拨测要访问外网和局域网里的设备；通知渠道（Telegram、SMTP、Webhook）也得出网。
    - network.egress
  requirements:
    arch: [amd64, arm64]
